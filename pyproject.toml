[project]
name = "my-agent-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "folium>=0.20.0",
    "httpx[http2]>=0.27",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "python-dotenv>=1.0",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agent = "my_agent_core.main:main"
agent-ui = "my_agent_core.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent_core"]

[dependency-groups]
dev = [
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=2.0",
]
