[project]
name = "my-agent-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx[http2]>=0.27",
    "matplotlib>=3.10.8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agent = "my_agent_core.main:main"
agent-ui = "my_agent_core.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent_core"]
